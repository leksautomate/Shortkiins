<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        textarea, select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 10px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .status-message {
            text-align: center;
            font-size: 1.1rem;
            color: #333;
            margin-top: 10px;
        }

        .video-container {
            display: none;
            margin-top: 30px;
            text-align: center;
        }

        .video-container.active {
            display: block;
        }

        video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .download-btn {
            margin-top: 20px;
            background: #28a745;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44336;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: #c62828;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .aspect-ratio-info {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 AI Video Generator</h1>
            <p class="subtitle">Transform your script into professional videos with AI</p>
        </header>

        <div class="main-card">
            <div class="info-box">
                <strong>💡 How it works:</strong> Enter your script, choose settings, and let AI generate your video!
            </div>

            <form id="videoForm">
                <div class="form-group">
                    <label for="script">📝 Your Script</label>
                    <textarea
                        id="script"
                        name="script"
                        placeholder="Enter your script here... (minimum 10 characters)"
                        required
                    ></textarea>
                </div>

                <div class="settings-grid">
                    <div class="form-group">
                        <label for="aspectRatio">📐 Aspect Ratio</label>
                        <select id="aspectRatio" name="aspectRatio">
                            <option value="16:9">16:9 (Landscape)</option>
                            <option value="9:16">9:16 (Portrait)</option>
                        </select>
                        <div class="aspect-ratio-info" id="aspectInfo">
                            For YouTube, Web (1280x720)
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="imageProvider">🎨 Image Provider</label>
                        <select id="imageProvider" name="imageProvider">
                            <option value="wavespeed">Wave Speed (Fastest)</option>
                            <option value="freepik">Freepik (Cinematic)</option>
                            <option value="replicate">Replicate</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sceneDuration">⏱️ Scene Duration (seconds)</label>
                        <input
                            type="number"
                            id="sceneDuration"
                            name="sceneDuration"
                            min="1"
                            max="10"
                            step="0.5"
                            value="3"
                        >
                    </div>
                </div>

                <button type="submit" class="btn" id="generateBtn">
                    🚀 Generate Video
                </button>
            </form>

            <div class="progress-container" id="progressContainer">
                <h3>Generating Your Video...</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="status-message" id="statusMessage">Initializing...</div>
            </div>

            <div class="video-container" id="videoContainer">
                <h3>✅ Video Generated Successfully!</h3>
                <video id="videoPlayer" controls></video>
                <br>
                <button class="btn download-btn" id="downloadBtn">
                    📥 Download Video
                </button>
            </div>

            <div id="errorContainer"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('videoForm');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusMessage = document.getElementById('statusMessage');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorContainer = document.getElementById('errorContainer');
        const aspectRatio = document.getElementById('aspectRatio');
        const aspectInfo = document.getElementById('aspectInfo');

        let currentJobId = null;
        let pollInterval = null;

        // Update aspect ratio info
        aspectRatio.addEventListener('change', (e) => {
            if (e.target.value === '16:9') {
                aspectInfo.textContent = 'For YouTube, Web (1280x720)';
            } else {
                aspectInfo.textContent = 'For TikTok, Reels, Shorts (720x1280)';
            }
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset UI
            errorContainer.innerHTML = '';
            videoContainer.classList.remove('active');
            progressContainer.classList.add('active');
            generateBtn.disabled = true;

            const formData = {
                script: document.getElementById('script').value,
                aspect_ratio: document.getElementById('aspectRatio').value,
                image_provider: document.getElementById('imageProvider').value,
                scene_duration: parseFloat(document.getElementById('sceneDuration').value)
            };

            try {
                // Submit job
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to start video generation');
                }

                const data = await response.json();
                currentJobId = data.job_id;

                // Start polling for status
                startPolling();

            } catch (error) {
                showError(error.message);
                resetUI();
            }
        });

        // Poll job status
        function startPolling() {
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/jobs/${currentJobId}`);
                    const job = await response.json();

                    updateProgress(job.progress, job.message);

                    if (job.status === 'completed') {
                        clearInterval(pollInterval);
                        showVideo(job.video_url);
                    } else if (job.status === 'failed') {
                        clearInterval(pollInterval);
                        showError(job.message);
                        resetUI();
                    }
                } catch (error) {
                    clearInterval(pollInterval);
                    showError('Failed to check job status');
                    resetUI();
                }
            }, 2000); // Poll every 2 seconds
        }

        // Update progress
        function updateProgress(progress, message) {
            progressFill.style.width = progress + '%';
            progressFill.textContent = progress + '%';
            statusMessage.textContent = message;
        }

        // Show video
        function showVideo(videoUrl) {
            progressContainer.classList.remove('active');
            videoContainer.classList.add('active');
            videoPlayer.src = videoUrl;
            generateBtn.disabled = false;

            downloadBtn.onclick = () => {
                window.location.href = videoUrl;
            };
        }

        // Show error
        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }

        // Reset UI
        function resetUI() {
            progressContainer.classList.remove('active');
            generateBtn.disabled = false;
        }
    </script>
</body>
</html>
